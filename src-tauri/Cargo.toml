[package]
name = "qed"
description = "Desktop app that turns a folder of pages and posts into a static website and publishes it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "qed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qed-core = { path = "../crates/qed-core", features = ["specta"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-window-state = "2.5.0"
keyring = "4.2.0"
# Generates src/lib/bindings.ts from the commands. Still release candidates,
# so the versions are pinned with `=`.
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

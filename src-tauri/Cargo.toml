[package]
name = "qed"
description = "Desktop app that turns a folder of pages and posts into a static website and publishes it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "qed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qed-core = { path = "../crates/qed-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

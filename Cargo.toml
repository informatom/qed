[workspace]
members = ["src-tauri", "crates/qed-core", "crates/qed-mcp"]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/informatom/qed"
authors = ["Stefan Haslinger"]

# Small, fast release builds. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding and resizing photos is ~25x slower unoptimized, and `tauri dev`
# and the tests use the dev profile. Optimizing just these crates keeps
# builds of qed's own code as fast as before.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
flate2 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
moxcms = { opt-level = 3 }
# WebP copies (#085): libwebp is C, built by the cc crate, which takes
# the optimization level from here too.
libwebp-sys = { opt-level = 3 }
# Typst (#154) sets a site's PDF many times slower unoptimized.
typst = { opt-level = 3 }
typst-library = { opt-level = 3 }
typst-layout = { opt-level = 3 }
typst-realize = { opt-level = 3 }
typst-eval = { opt-level = 3 }
typst-syntax = { opt-level = 3 }
typst-pdf = { opt-level = 3 }
typst-utils = { opt-level = 3 }
comemo = { opt-level = 3 }
krilla = { opt-level = 3 }
krilla-svg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
subsetter = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
hypher = { opt-level = 3 }
icu_segmenter = { opt-level = 3 }
usvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }

# No debug information for the dependencies: nobody steps through them in
# a debugger, and it was most of target/ (tens of GB across `tauri dev`,
# tests and clippy). q.e.d.'s own crates keep theirs, so backtraces still
# show our lines. Settings for a named package above still apply.
[profile.dev.package."*"]
debug = false

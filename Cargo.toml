[workspace]
members = ["src-tauri", "crates/qed-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/haslinger/qed"
authors = ["Stefan Haslinger"]

# Small, fast release builds. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

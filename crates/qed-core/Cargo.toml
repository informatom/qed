[package]
name = "qed-core"
description = "qed's domain logic: sites, pages and the site generator, independent of the desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
askama = "0.16.1"
comrak = { version = "0.57.0", default-features = false }
deunicode = "1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tiny_http = "0.12.0"
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

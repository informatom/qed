[package]
name = "qed-core"
description = "qed's domain logic: sites, pages and the site generator, independent of the desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
askama = "0.16.1"
# syntect-fancy: code highlighting with a pure-Rust regex engine (no C).
comrak = { version = "0.57.0", default-features = false, features = ["syntect-fancy"] }
deunicode = "1"
getrandom = "0.3"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# For Video blocks: title and thumbnail, fetched once over oEmbed. The same
# reqwest as Tauri's updater, with rustls on ring (no second TLS stack).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
# The same syntect comrak uses, for the stylesheet of highlighted code.
syntect = { version = "5", default-features = false, features = ["default-themes", "html", "regex-fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.0", features = ["rt", "macros", "fs", "io-util", "sync"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Derives `specta::Type`, so the desktop shell can generate TypeScript types
# for the UI (src/lib/bindings.ts).
specta = ["dep:specta"]

<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <title>Moved</title>
  <meta name="color-scheme" content="{% if dark_side.is_some() %}light dark{% else if dark %}dark{% else %}light{% endif %}">
  <style>body{background:{{ background }};color:{{ text }};font-family:system-ui,sans-serif;margin:2rem}a{color:inherit}
  {%- if let Some((background, text)) = dark_side %}@media (prefers-color-scheme:dark){body{background:{{ background }};color:{{ text }}}}{% endif %}</style>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <link rel="canonical" href="{{ target }}">
</head>
<body>
  <p>This page has moved to <a href="{{ target }}">{{ target }}</a>.</p>
</body>
</html>

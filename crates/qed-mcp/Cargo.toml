[package]
name = "qed-mcp"
description = "Lets AI assistants work on a q.e.d. site through the Model Context Protocol (MCP), with the app's rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
qed-core = { path = "../qed-core" }
# The official Rust SDK for MCP: a server, its tool macros, and stdio.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
